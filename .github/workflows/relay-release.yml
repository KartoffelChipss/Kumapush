name: Release relay image

on:
    release:
        types: [published]

permissions:
    contents: read

env:
    IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/kumapush
    VERSION: ${{ github.event.release.tag_name }}

jobs:
    build:
        name: Build ${{ matrix.platform }}
        if: startsWith(github.event.release.tag_name, 'relay@')
        strategy:
            fail-fast: true
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-24.04
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: relay
                  platforms: ${{ matrix.platform }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.version=${{ github.event.release.tag_name }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

            - name: Export digest
              run: |
                  mkdir -p "${{ runner.temp }}/digests"
                  digest="${{ steps.build.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"

            - uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ strategy.job-index }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        name: Publish multi-arch manifest
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - name: Get version from tag
              run: echo "SEMVER=${VERSION#relay@}" >> "$GITHUB_ENV"

            - uses: actions/download-artifact@v4
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Generate tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE }}
                  # 1.2.3, 1.2, 1 and latest; prereleases only get their exact version.
                  tags: |
                      type=semver,pattern={{version}},value=${{ env.SEMVER }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ env.SEMVER }}
                      type=semver,pattern={{major}},value=${{ env.SEMVER }}

            - name: Create manifest list and push
              working-directory: ${{ runner.temp }}/digests
              run: |
                  # Word splitting is intended: each tag and digest becomes its own argument.
                  # shellcheck disable=SC2046
                  docker buildx imagetools create \
                    $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.IMAGE }}@sha256:%s ' *)

            - name: Inspect image
              run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
